# ============================================================================
# Waffle Release Wave — propagates umbrella tag → every component repo
# ----------------------------------------------------------------------------
# Triggered on any tag push to the umbrella (matches naming like 0.1.0-beta0).
# For each entry in .gitmodules (minus EXCLUDE_SUBMODULES): pulls the
# umbrella-pinned SHA, asserts it is reachable from the component's
# origin/main (or origin/master), creates + pushes the same tag in the
# component's repo, then creates a GitHub Release on that tag with
# auto-generated notes (PR-based via gh's --generate-notes). Existing
# Packagist webhooks pick up the new tags automatically — no Packagist API
# call needed.
#
# Pre-release detection: tags matching PRERELEASE_REGEX become GitHub
# pre-releases (defaults: -alpha/-beta/-rc/-dev/-pre suffixes).
#
# Idempotent on re-run: if a prior wave pushed the tag but failed before the
# release was created, re-running this workflow on the same tag will create
# the missing release without touching the tag. If both already exist with
# the correct SHA, the component is skipped.
#
# Required secret: WAFFLE_RELEASE_TOKEN  — a fine-grained PAT (or GitHub App
# installation token) with `Contents: read & write` on every waffle-commons/*
# component repo (covers both tag push and Release creation). The default
# GITHUB_TOKEN cannot push to other repositories.
# ============================================================================

name: release-wave

on: workflow_dispatch
#  push:
#    tags:
#      - '*'

permissions:
  contents: read

concurrency:
  group: release-wave-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fan-out:
    name: Tag every component @ ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      UMBRELLA_TAG:       ${{ github.ref_name }}
      RELEASE_TOKEN:      ${{ secrets.WAFFLE_RELEASE_TOKEN }}
      # Comma-separated submodule paths to skip entirely (no tag, no release).
      EXCLUDE_SUBMODULES: 'component-template'
      # POSIX ERE matched with `grep -E`; matches umbrella-style tags like
      # '0.1.0-beta0' or '1.2.3-rc.4'. Non-matching tags are treated as stable.
      PRERELEASE_REGEX:   '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|pre)([0-9.]*)?$'

    steps:
      - name: Checkout umbrella (no submodule content needed)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Validate release token
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            cat <<'MSG'
          ::error::secrets.WAFFLE_RELEASE_TOKEN is not set.
          This workflow tags every waffle-commons/* component repo with the umbrella tag.
          That requires write access across the org — the default GITHUB_TOKEN cannot do this.
          Provision a fine-grained PAT (or GitHub App installation token) with
          'Contents: read & write' on every waffle-commons/* component repo, then add it
          to this repository's secrets as WAFFLE_RELEASE_TOKEN.
          MSG
            exit 1
          fi
          # Mask early so any accidental echo is redacted.
          echo "::add-mask::$RELEASE_TOKEN"

      - name: Configure git identity
        run: |
          git config --global user.name  "waffle-release-bot"
          git config --global user.email "release-bot@users.noreply.github.com"
          git config --global core.pager cat

      - name: Fan out tag to every submodule
        run: |
          set -euo pipefail
          echo "::add-mask::$RELEASE_TOKEN"

          if [ ! -f .gitmodules ]; then
            echo "::error file=.gitmodules::.gitmodules not found in umbrella"
            exit 1
          fi

          MANIFEST="${RUNNER_TEMP}/manifest.tsv"
          python3 - <<'PY' > "$MANIFEST"
          import configparser
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for s in c.sections():
              path = c.get(s, 'path', fallback=None)
              url  = c.get(s, 'url',  fallback=None)
              if path and url:
                  print(f"{path}\t{url}")
          PY

          n=$(wc -l < "$MANIFEST" | tr -d ' ')
          echo "Discovered $n submodule(s) to process with tag '$UMBRELLA_TAG'"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          # Pre-compute the EXCLUDE set + pre-release flag once.
          IFS=',' read -r -a _EXCLUDE_ARR <<<"$EXCLUDE_SUBMODULES"
          is_excluded() {
            local needle="$1" item
            for item in "${_EXCLUDE_ARR[@]:-}"; do
              # Trim whitespace.
              item="${item#"${item%%[![:space:]]*}"}"
              item="${item%"${item##*[![:space:]]}"}"
              [ -z "$item" ] && continue
              [ "$item" = "$needle" ] && return 0
            done
            return 1
          }

          PRERELEASE_FLAG=""
          if printf '%s' "$UMBRELLA_TAG" | grep -qE "$PRERELEASE_REGEX"; then
            PRERELEASE_FLAG="--prerelease"
            echo "Tag '$UMBRELLA_TAG' matches PRERELEASE_REGEX → releases will be marked as pre-release"
          else
            echo "Tag '$UMBRELLA_TAG' is a stable release"
          fi

          declare -a released=()
          declare -a tagged=()
          declare -a skipped=()
          declare -a excluded=()
          declare -a failed=()

          while IFS=$'\t' read -r path url; do
            echo "::group::$path  ($url)"

            # 0. Early opt-out via EXCLUDE_SUBMODULES (no network, no clone)
            if is_excluded "$path"; then
              echo "excluded by EXCLUDE_SUBMODULES — skipping tag + release"
              excluded+=("$path")
              echo "::endgroup::"; continue
            fi

            # 1. SHA the umbrella pins for this submodule
            sha="$(git ls-tree HEAD -- "$path" | awk '$2=="commit"{print $3}')"
            if [ -z "$sha" ]; then
              echo "::error::no commit SHA pinned for '$path' in umbrella HEAD"
              failed+=("$path:no-pinned-sha")
              echo "::endgroup::"; continue
            fi
            echo "umbrella pins: $sha"

            # 2. Token-authenticated origin URL + derive owner/name for gh CLI
            case "$url" in
              git@*:*)
                origin_url="$(printf '%s' "$url" | sed -E 's#^git@([^:]+):#https://x-access-token:'"$RELEASE_TOKEN"'@\1/#')"
                ;;
              https://*)
                origin_url="$(printf '%s' "$url" | sed -E 's#^https://#https://x-access-token:'"$RELEASE_TOKEN"'@#')"
                ;;
              *)
                echo "::warning::unsupported remote URL scheme for '$path': $url — skipping"
                skipped+=("$path:unsupported-url")
                echo "::endgroup::"; continue
                ;;
            esac
            gh_repo="$(printf '%s' "$url" | sed -E 's#^(git@[^:]+:|https://[^/]+/)##; s#\.git$##')"

            # 3. Bare-ish clone in a temp dir, fetch all branches + the pinned SHA
            wd="$tmpdir/$path"
            mkdir -p "$wd"
            (
              cd "$wd"
              git init -q
              git remote add origin "$origin_url"
              if ! git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'; then
                echo "::error::fetch failed for $path"
                exit 1
              fi
              # Also try to fetch the pinned SHA explicitly (works if uploadpack.allowReachableSHA1InWant is on; GitHub: yes).
              git fetch -q origin "$sha" 2>/dev/null || true

              # 4. Verify SHA is reachable from origin/main or origin/master
              reachable=""
              for ref in origin/main origin/master; do
                if git rev-parse --verify "$ref" >/dev/null 2>&1; then
                  if git merge-base --is-ancestor "$sha" "$ref" 2>/dev/null; then
                    reachable="$ref"
                    break
                  fi
                fi
              done

              if [ -z "$reachable" ]; then
                cat <<MSG
          ::error::SHA $sha is NOT on origin/main or origin/master for '$path'.
          ::error::The contributor likely forgot to push the submodule branch, or the
          ::error::bump landed on a feature branch that was never merged. Refusing to tag.
          MSG
                exit 1
              fi
              echo "reachable from: $reachable"

              # 5. Idempotent tag check on remote — set tag_state without exiting
              tag_state=""
              if git ls-remote --tags origin "refs/tags/$UMBRELLA_TAG" | grep -q "refs/tags/$UMBRELLA_TAG"; then
                git fetch -q origin "refs/tags/$UMBRELLA_TAG:refs/tags/$UMBRELLA_TAG" 2>/dev/null || true
                resolved="$(git rev-parse "refs/tags/$UMBRELLA_TAG^{commit}" 2>/dev/null || echo "")"
                if [ "$resolved" = "$sha" ]; then
                  echo "tag '$UMBRELLA_TAG' already at $sha → keep, proceed to release check"
                  tag_state="existed"
                else
                  echo "::error::tag '$UMBRELLA_TAG' already exists on '$path' at $resolved (umbrella pins $sha). Refusing to overwrite."
                  exit 1
                fi
              fi

              # 6. Create + push lightweight tag at the pinned SHA (if needed)
              if [ -z "$tag_state" ]; then
                git tag "$UMBRELLA_TAG" "$sha"
                git push origin "refs/tags/$UMBRELLA_TAG"
                echo "tagged $path @ $sha → $UMBRELLA_TAG"
                tag_state="new"
              fi
              echo "__TAG__:$tag_state"

              # 7. GitHub Release with auto-generated notes (idempotent)
              release_state=""
              if GH_TOKEN="$RELEASE_TOKEN" GH_REPO="$gh_repo" \
                   gh release view "$UMBRELLA_TAG" --json tagName >/dev/null 2>&1
              then
                echo "release '$UMBRELLA_TAG' already exists on $gh_repo → skipping creation"
                release_state="existed"
              else
                echo "creating release '$UMBRELLA_TAG' on $gh_repo (prerelease=${PRERELEASE_FLAG:-no})..."
                # shellcheck disable=SC2086  # PRERELEASE_FLAG is intentionally word-split (empty or '--prerelease')
                if ! GH_TOKEN="$RELEASE_TOKEN" GH_REPO="$gh_repo" \
                       gh release create "$UMBRELLA_TAG" \
                         --target "$sha" \
                         --title  "$UMBRELLA_TAG" \
                         --generate-notes \
                         $PRERELEASE_FLAG
                then
                  echo "::error::gh release create failed for $gh_repo (tag $UMBRELLA_TAG)"
                  exit 1
                fi
                release_state="new"
              fi
              echo "__RELEASE__:$release_state"
            ) > "$wd/out.log" 2>&1
            rc=$?
            cat "$wd/out.log"

            if [ "$rc" -ne 0 ]; then
              failed+=("$path")
            else
              tag_st="$(grep -E '^__TAG__:'     "$wd/out.log" | tail -1 | cut -d: -f2)"
              rel_st="$(grep -E '^__RELEASE__:' "$wd/out.log" | tail -1 | cut -d: -f2)"
              if [ "$tag_st" = "new" ] && [ "$rel_st" = "new" ]; then
                released+=("$path")
              elif [ "$tag_st" = "existed" ] && [ "$rel_st" = "existed" ]; then
                skipped+=("$path")
              else
                tagged+=("$path")
              fi
            fi
            echo "::endgroup::"
          done < "$MANIFEST"

          echo ""
          echo "=========================================="
          echo " Release wave summary — $UMBRELLA_TAG"
          echo "=========================================="
          printf '  released : %d  %s\n' "${#released[@]}" "${released[*]:-}"
          printf '  tagged   : %d  %s\n' "${#tagged[@]}"   "${tagged[*]:-}"
          printf '  skipped  : %d  %s\n' "${#skipped[@]}"  "${skipped[*]:-}"
          printf '  excluded : %d  %s\n' "${#excluded[@]}" "${excluded[*]:-}"
          printf '  failed   : %d  %s\n' "${#failed[@]}"   "${failed[*]:-}"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::release-wave failed for ${#failed[@]} submodule(s): ${failed[*]}"
            exit 1
          fi
          echo "✓ release-wave completed cleanly"
