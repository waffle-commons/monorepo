# ============================================================================
# Waffle Umbrella CI — incremental, parallel, strict
# ----------------------------------------------------------------------------
# Detects which submodule component changed in the umbrella diff, then fans
# out a parallel matrix of composer install + mago lint + mago analyze +
# phpunit + a strict 95% clover-coverage gate per component.
# ============================================================================

name: umbrella-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: umbrella-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Detect which components changed and emit a dynamic matrix.
  # --------------------------------------------------------------------------
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.matrix.outputs.components }}
      any:        ${{ steps.matrix.outputs.any }}
      workspace:  ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout umbrella
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: none
          filters: |
            async:            'async/**'
            auth:             'auth/**'
            cache:            'cache/**'
            config:           'config/**'
            console:          'console/**'
            container:        'container/**'
            contracts:        'contracts/**'
            data:             'data/**'
            error-handler:    'error-handler/**'
            event-dispatcher: 'event-dispatcher/**'
            http:             'http/**'
            http-client:      'http-client/**'
            log:              'log/**'
            pipeline:         'pipeline/**'
            routing:          'routing/**'
            runtime:          'runtime/**'
            security:         'security/**'
            telemetry:        'telemetry/**'
            telemetry-otel:   'telemetry-otel/**'
            utils:            'utils/**'
            waffle:           'waffle/**'
            workspace:        'workspace/**'

      - name: Build matrix
        id: matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          echo "Raw changes JSON: $CHANGES"
          # 'workspace' has its own dedicated job (it needs all 21 path-repo
          # submodules) — strip it from the per-component check matrix.
          COMPONENTS=$(jq -c 'map(select(. != "workspace"))' <<< "$CHANGES")
          echo "Component matrix JSON: $COMPONENTS"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          if [ "$COMPONENTS" = "[]" ] || [ -z "$COMPONENTS" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true"  >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # 2. Per-component check matrix.
  # --------------------------------------------------------------------------
  check:
    name: ${{ matrix.component }}
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.components) }}
    env:
      COMPONENT: ${{ matrix.component }}

    steps:
      - name: Checkout umbrella (no submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Init ONLY the component under test — never the private 'academy' submodule
      # (the default GITHUB_TOKEN is repo-scoped and can't clone it). Rewrite the
      # SSH remote to HTTPS so the runner reads the public component repo
      # anonymously (no SSH key, no token needed).
      - name: Init only the component under test
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync -- "$COMPONENT"
          git submodule update --init --depth=1 -- "$COMPONENT"

      - name: Sanity-check component dir
        run: |
          set -euo pipefail
          if [ ! -d "$COMPONENT" ] || [ ! -f "$COMPONENT/composer.json" ]; then
            echo "::error::Component '$COMPONENT' has no composer.json — is the submodule checked out?"
            exit 1
          fi

      - name: Setup PHP 8.5 + Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug
          extensions: mbstring, intl, opcache, xml, dom, tokenizer

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ matrix.component }}/vendor
          key:  composer-${{ runner.os }}-${{ matrix.component }}-${{ hashFiles(format('{0}/composer.lock', matrix.component)) }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.component }}-

      - name: composer install
        working-directory: ${{ matrix.component }}
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: mago fmt (check)
        working-directory: ${{ matrix.component }}
        run: vendor/bin/mago fmt --check

      - name: mago lint
        working-directory: ${{ matrix.component }}
        run: vendor/bin/mago lint

      - name: mago analyze
        working-directory: ${{ matrix.component }}
        run: vendor/bin/mago analyze

      - name: mago guard
        working-directory: ${{ matrix.component }}
        run: vendor/bin/mago guard

      - name: composer audit (DEP-04)
        working-directory: ${{ matrix.component }}
        run: composer audit

      # The composer package is only a bootstrapper: bin/igor-php resolves
      # releases/latest from the GitHub API and downloads THAT binary, so the
      # composer constraint and composer.lock pin nothing. Seed the version file
      # it reads, then assert the pin actually took — otherwise an upstream
      # release silently changes what this gate audits.
      - name: Pin the Igor auditor
        working-directory: ${{ matrix.component }}
        env:
          IGOR_VERSION: '0.7.0'
        run: |
          mkdir -p vendor/igor-php/igor-php/resources/bin
          printf '%s' "$IGOR_VERSION" > vendor/igor-php/igor-php/resources/bin/.version
          vendor/bin/igor-php --version | grep -qF "$IGOR_VERSION"

      - name: igor-php
        working-directory: ${{ matrix.component }}
        run: vendor/bin/igor-php .

      - name: composer tests
        working-directory: ${{ matrix.component }}
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --coverage-clover ./var/data/phpunit-coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./var/data/phpunit-coverage/clover.xml

  # --------------------------------------------------------------------------
  # 3. Workspace demo app — composer/security posture gate (audit FIX-01 #10).
  #    Not a library: composer validate + install + static gates + composer
  #    audit only — no phpunit/coverage gate. This is the demo-app policy; it is
  #    the only exemption in this workflow (every framework component is fully
  #    gated, igor included).
  # --------------------------------------------------------------------------
  workspace:
    name: workspace
    needs: detect-changes
    if: needs.detect-changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout umbrella (no submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # workspace/composer.json declares 21 path repositories (../contracts …
      # ../telemetry-otel), so ALL of them must be checked out or composer
      # install fails. Never the private 'academy' submodule (the default
      # GITHUB_TOKEN is repo-scoped and can't clone it). Rewrite the SSH remote
      # to HTTPS so the runner reads the public repos anonymously.
      - name: Init workspace + its 21 path-repo components
        run: |
          set -euo pipefail
          COMPONENTS="workspace contracts utils config container http http-client routing pipeline event-dispatcher log error-handler cache security auth console data runtime waffle async telemetry telemetry-otel"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # shellcheck disable=SC2086 — word-splitting is intentional here.
          git submodule sync -- $COMPONENTS
          git submodule update --init --depth=1 -- $COMPONENTS

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, opcache, xml, dom, tokenizer, yaml

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: workspace/vendor
          key:  composer-${{ runner.os }}-workspace-${{ hashFiles('workspace/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-workspace-

      # --no-check-all: the 21 exact '1.0.0-dev' path-repo pins are intentional
      # for the demo app; the strict pass still enforces schema + publish rules.
      - name: composer validate (strict)
        working-directory: workspace
        run: composer validate --strict --no-check-all

      - name: composer install
        working-directory: workspace
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: mago fmt (check)
        working-directory: workspace
        run: vendor/bin/mago fmt --check

      - name: mago lint
        working-directory: workspace
        run: vendor/bin/mago lint

      - name: mago analyze
        working-directory: workspace
        run: vendor/bin/mago analyze

      - name: mago guard
        working-directory: workspace
        run: vendor/bin/mago guard

      - name: composer audit (DEP-04)
        working-directory: workspace
        run: composer audit

  # --------------------------------------------------------------------------
  # 4. SEC-03 timing-safe comparison gate (cross-component, autoload-free).
  #    Bans naive === / !== between two runtime secrets that must use
  #    hash_equals(); Mago has no custom-rule API to express this.
  # --------------------------------------------------------------------------
  sec03:
    name: SEC-03 timing-safe comparison gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout umbrella (no submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 'console' holds the SensitiveComparisonScanner sources the audit require()s;
      # the other seven are the scanned components (keep in sync with the audit args
      # below). Never the private 'academy' submodule. HTTPS rewrite → anonymous read.
      # NB: a missing scan-target is silently skipped, so all seven must be present or
      # the gate would falsely pass having scanned nothing.
      - name: Init audit scanner (console) + scanned components
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync -- console auth security http http-client data cache telemetry
          git submodule update --init --depth=1 -- console auth security http http-client data cache telemetry

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, tokenizer

      - name: SEC-03 audit (security-sensitive components)
        run: php scripts/sec03-compare-audit.php auth security http http-client data cache telemetry

  # --------------------------------------------------------------------------
  # 5. Single aggregating gate so branch protection can pin one required check.
  # --------------------------------------------------------------------------
  gate:
    name: umbrella-ci gate
    needs: [detect-changes, check, workspace, sec03]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          set -euo pipefail
          # FAIL-CLOSED: if detect-changes itself failed (or was cancelled), its
          # outputs are empty strings — the matrix/workspace jobs silently skip
          # and the 'any != true' early exit below would go green having checked
          # nothing. Assert it succeeded BEFORE trusting any of its outputs.
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "::error::detect-changes did not succeed (result: ${{ needs.detect-changes.result }}) — its outputs are untrustworthy, failing closed"
            exit 1
          fi
          if [ "${{ needs.sec03.result }}" != "success" ]; then
            echo "::error::SEC-03 timing-safe comparison gate failed (result: ${{ needs.sec03.result }})"
            exit 1
          fi
          if [ "${{ needs.workspace.result }}" != "success" ] && [ "${{ needs.workspace.result }}" != "skipped" ]; then
            echo "::error::workspace job failed (result: ${{ needs.workspace.result }})"
            exit 1
          fi
          if [ "${{ needs.detect-changes.outputs.any }}" != "true" ]; then
            echo "✓ No component changed — gate trivially green (SEC-03 passed)."
            exit 0
          fi
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "::error::check matrix did not succeed (result: ${{ needs.check.result }})"
            exit 1
          fi
          echo "✓ All component checks + SEC-03 passed."
