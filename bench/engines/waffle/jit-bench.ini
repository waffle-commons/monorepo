; Bench-only PHP ini drop-in for Engine A (Waffle / skeleton prod image).
; JIT parity across all three engines — values are the reference profile from
; workspace/docker/php/mode-bench.ini (see bench/README.md, "Fairness pinning").
; Mounted read-only into /usr/local/etc/php/conf.d/ by docker-compose.bench.yml.
; Engines B and C must apply the exact same three values in their own images.
opcache.jit=1234
opcache.jit_buffer_size=128M
; Already set by the skeleton prod image stage — re-asserted here so the parity
; contract is complete and self-documenting in one file per engine.
opcache.validate_timestamps=0
