; Engine C bench ini — JIT/opcache parity across all three engines.
; Reference profile: workspace/docker/php/mode-bench.ini (see also
; bench/engines/waffle/jit-bench.ini for engine A and
; bench/engines/symfony-fpm/zz-bench.ini for engine B — keep the three aligned).
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=1234
opcache.jit_buffer_size=128M

; opcache.preload intentionally NOT set (same decision as engine B — typical
; Symfony deployment baseline; worker mode already keeps the app booted).

; prod hygiene
realpath_cache_size=4096K
realpath_cache_ttl=600
expose_php=0
date.timezone=UTC
memory_limit=256M
