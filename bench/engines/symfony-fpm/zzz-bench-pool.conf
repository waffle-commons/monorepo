; Engine B FPM pool override — sorts after the image's zz-docker.conf.
[www]
; --- pm.static sizing arithmetic (plan: "~16 @ 1g") -------------------------
; Budget: mem_limit = 1024 MiB (compose), cpus = 2.
; Shared allocations (counted ONCE, SHM): opcache 256 MiB + JIT buffer 128 MiB
;   = 384 MiB.
; nginx (2 workers) + FPM master + kernel/socket overhead ~ 40 MiB.
; Remaining for PHP children: 1024 - 384 - 40 ~ 600 MiB.
; A Symfony prod child's UNIQUE RSS (beyond shared opcache pages) ~ 35-40 MiB.
; 16 children x ~38 MiB ~ 610 MiB ~ budget => pm.max_children = 16.
; ----------------------------------------------------------------------------
pm = static
pm.max_children = 16

; Never recycle children mid-run: mirrors MAX_REQUESTS pinned very high on
; engine A (recycling would mask leaks and add fork noise to the ladder).
pm.max_requests = 0

; FPM clears the environment by default — the app MUST see the DB_* /APP_ENV
; vars injected by the Dockerfile and docker-compose.bench.yml.
clear_env = no

catch_workers_output = yes
