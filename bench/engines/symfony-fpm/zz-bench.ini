; Engine B bench ini — JIT/opcache parity across all three engines.
; Reference profile: workspace/docker/php/mode-bench.ini (see also
; bench/engines/waffle/jit-bench.ini for engine A).
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=1234
opcache.jit_buffer_size=128M

; opcache.preload is intentionally NOT set: this engine is the "typical
; Symfony deployment" baseline and default distro/docs setups do not configure
; preload. If a preloaded variant is ever measured, record it as a separate
; engine config in BENCH-GATE-RESULT.md — never silently.

; prod hygiene
realpath_cache_size=4096K
realpath_cache_ttl=600
expose_php=0
date.timezone=UTC
memory_limit=256M
