# Engine B nginx config — minimal, typical Symfony vhost, serving on :80.
# nginx runs daemonized alongside php-fpm (foreground PID 1) — see start.sh.
user www-data;
worker_processes 2;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Parity: Caddy/FrankenPHP engines do not write per-request access logs.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /app/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass fpm;
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        # Never execute arbitrary PHP files (Symfony single-entrypoint).
        location ~ \.php$ {
            return 404;
        }
    }
}
