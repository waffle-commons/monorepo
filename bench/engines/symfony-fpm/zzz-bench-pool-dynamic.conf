; Engine B-dyn — PHP-FPM process pool for BENCH-05 (memory-vs-concurrency).
;
; WHY A SECOND POOL CONFIG EXISTS
; -------------------------------
; The BENCH-02 pool (zzz-bench-pool.conf) uses `pm = static, max_children = 16`
; so the FPM engine presents a FIXED, pre-forked process set. That is the right
; choice for a latency comparison at pinned resources — but it makes the engine
; structurally incapable of demonstrating (or refuting) the "5-10x RAM vs
; PHP-FPM" claim, because FPM's memory is then constant by construction and
; cannot grow with concurrency. Measuring memory against a static pool caps the
; very variable under test.
;
; This pool restores FPM's real production behaviour: children are spawned on
; demand as concurrency rises, which is exactly the mechanism the RAM claim is
; about (one OS process per in-flight request, each carrying its own PHP heap,
; opcache attach and per-request allocations).
;
; max_children is deliberately high enough that FPM — not the config — decides
; when to stop: at 128 children * ~30-80 MB the engine would need several GB,
; which is the point of the measurement. The compose service for this engine
; therefore raises mem_limit well above the expected ceiling (see
; docker-compose.bench.yml, engine-b-dyn) so the container limit never truncates
; the curve. CPU stays pinned identically to every other engine — CPU is the
; controlled variable, memory is the dependent one.
;
; If FPM hits max_children it queues in the listen backlog and latency spikes;
; that saturation point is itself a reportable result, so do NOT silently raise
; this value mid-experiment — record the ceiling that was in force.
[www]
pm = dynamic
pm.max_children = 128
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 0
pm.process_idle_timeout = 30s
clear_env = no
catch_workers_output = yes

; Surface the pool's own view of itself so the run can be cross-checked against
; container RSS rather than trusting a single source (scraped over the nginx
; vhost only from inside the bench network).
pm.status_path = /fpm-status
